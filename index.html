<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#14091f">
<meta name="color-scheme" content="dark">
<meta name="supported-color-schemes" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Friend's room">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<title>Friend's room</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="auroraCanvas" class="aurora-canvas"></canvas>

  <!-- Name / identity modal -->
  <div class="name-overlay" id="nameOverlay">
    <div class="name-card">
      <div class="brand-mark" id="nameModalBrand">ᠻ𝘳𝓲ꫀꪀᦔ𝘴' 𝘳ꪮꪮꪑ</div>
      <p class="sub">اختر اسمًا للانضمام إلى المحادثة</p>
      <div class="field">
        <input type="text" id="nameInput" placeholder=" " maxlength="20" autocomplete="off">
        <label for="nameInput">اسمك</label>
      </div>
      <button id="joinBtn"><span>دخول</span></button>
      <div class="err" id="nameErr"></div>
    </div>
  </div>

  <div class="app">
    <!-- Header -->
    <header class="chat-header">
      <div class="brand-intro" id="brandIntro">
        <span class="brand-intro-text" id="brandIntroText">Hi!</span>
      </div>
      <div class="header-meta">
        <button class="pill pill-btn bell-btn" id="notifBtn" aria-label="الإشعارات">
          <svg viewBox="0 0 24 24" width="17" height="17"><path d="M6 9a6 6 0 0 1 12 0c0 5 2 6.5 2 6.5H4S6 14 6 9z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M10 19a2 2 0 0 0 4 0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/><path class="slash" d="M4 4l16 16" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
          <span class="notif-dot" id="notifDot" style="display:none;"></span>
        </button>
        <button class="pill pill-btn" id="onlineBtn">
          <span class="status-dot" id="statusDot"></span>
          <span id="onlineCount">0</span>
        </button>
      </div>
    </header>

    <!-- Notification enable banner -->
    <div class="notif-banner" id="notifBanner" style="display:none;">
      <svg viewBox="0 0 24 24" width="18" height="18"><path d="M6 9a6 6 0 0 1 12 0c0 5 2 6.5 2 6.5H4S6 14 6 9z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M10 19a2 2 0 0 0 4 0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/></svg>
      <span class="notif-banner-text" id="notifBannerText"></span>
      <button class="notif-banner-btn" id="notifBannerBtn">تفعيل</button>
      <button class="notif-banner-close" id="notifBannerClose" aria-label="إغلاق">
        <svg viewBox="0 0 24 24" width="14" height="14"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
      </button>
    </div>

    <!-- Notification settings sheet -->
    <div class="sheet-backdrop" id="notifSheetBackdrop" style="display:none;">
      <div class="sheet">
        <div class="sheet-handle"></div>
        <h4>الإشعارات</h4>
        <div class="notif-status" id="notifStatus"></div>
        <button class="notif-enable-btn" id="notifEnableBtn" style="display:none;">تفعيل الإشعارات</button>
        <h4 class="notif-sub">كتم الإشعارات</h4>
        <div class="notif-options" id="notifOptions">
          <button class="notif-opt" data-mode="none"><span class="radio"></span><span class="opt-txt"><b>بدون كتم</b><small>تصلك كل الرسائل والردود</small></span></button>
          <button class="notif-opt" data-mode="normal"><span class="radio"></span><span class="opt-txt"><b>كتم الرسائل العادية</b><small>يصلك فقط ما فيه رد عليك</small></span></button>
          <button class="notif-opt" data-mode="all"><span class="radio"></span><span class="opt-txt"><b>كتم الكل</b><small>لا يصلك أي إشعار أو صوت</small></span></button>
        </div>
      </div>
    </div>

    <!-- Online users sheet -->
    <div class="sheet-backdrop" id="onlineSheetBackdrop" style="display:none;">
      <div class="sheet">
        <div class="sheet-handle"></div>
        <h4>متصل الآن</h4>
        <div id="onlineList"></div>
      </div>
    </div>

    <!-- Messages -->
    <main class="messages-wrap" id="messagesWrap">
      <div class="load-more-row" id="loadMoreRow" style="display:none;">
        <button class="load-more-btn" id="loadMoreBtn">تحميل رسائل أقدم</button>
      </div>
      <div class="welcome-card" id="welcomeCard">
        <div class="welcome-mark" id="welcomeBrand">ᠻ𝘳𝓲ꫀꪀᦔ𝘴' 𝘳ꪮꪮꪑ</div>
        <p>ابدأ أول محادثة</p>
      </div>
      <div id="messagesList"></div>
    </main>

    <button class="jump-bottom-btn" id="jumpBottomBtn">
      <svg viewBox="0 0 24 24" width="18" height="18"><path d="M12 5v14M5 12l7 7 7-7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
      <span class="jump-bottom-badge" id="jumpBottomBadge" style="display:none;">1</span>
    </button>

    <div class="typing-row" id="typingRow">
      <span id="typingNames"></span>
      <span class="typing-dots"><span></span><span></span><span></span></span>
    </div>

    <!-- Reply preview -->
    <div class="reply-preview" id="replyPreview" style="display:none;">
      <div class="bar"></div>
      <div class="body">
        <div class="who" id="replyPreviewWho"></div>
        <div class="txt" id="replyPreviewTxt"></div>
      </div>
      <button class="cancel" id="replyCancelBtn">
        <svg viewBox="0 0 24 24" width="16" height="16"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
      </button>
    </div>

    <!-- Composer -->
    <div class="composer">
      <div class="emoji-panel" id="emojiPanel">
        <div class="emoji-tabs" id="emojiTabs"></div>
        <div class="emoji-grid" id="emojiGrid"></div>
      </div>
      <button class="icon-btn" id="emojiToggleBtn" title="إيموجي" aria-label="إيموجي">
        <svg viewBox="0 0 24 24" width="20" height="20"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.6" fill="none"/><circle cx="9" cy="10" r="1.1" fill="currentColor"/><circle cx="15" cy="10" r="1.1" fill="currentColor"/><path d="M8 14.5c1 1.3 2.4 2 4 2s3-.7 4-2" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>
      </button>
      <div class="composer-input-wrap">
        <textarea class="composer-input" id="messageInput" placeholder="𝙼𝚎𝚜𝚜𝚊𝚐𝚎" maxlength="1000" rows="1"></textarea>
      </div>
      <button class="send-btn" id="sendBtn" aria-label="إرسال">
        <svg viewBox="0 0 24 24" width="19" height="19"><path d="M4 12L20 4L13 20L11 13L4 12Z" fill="currentColor"/></svg>
      </button>
    </div>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js"></script>

  <script src="emoji-data.js"></script>
  <script src="aurora.js"></script>
  <script src="app.js"></script>
</body>
</html>
